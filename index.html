<h1>rclone-adit</h1>
<p>rclone-adit is a private, single-user tool. Its owner uses it to back up and synchronise
his own documents between his own server and his own Google Drive, using the open-source
<a href="https://rclone.org">rclone</a> program.</p>
<p>It is not offered to the public and has no other users.</p>
